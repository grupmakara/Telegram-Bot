bolum: 1
baslik: "Ölü Adamın Dönüşü"
kanca: { kim: murad, metin: "On yıl önce beni öldürdüler… Bugün geri döndüm.", ifade: ofkeli }
sahneler:
  - mekan: idam_meydani
    gecmis: true
    karakterler: [{ id: yusuf, x: 0.3, ifade: uzgun }, { id: bekir, x: 0.72, ifade: sinsi }]
    satirlar:
      - { kim: anlatici, metin: "İstanbul, 1710. Kâtip Yusuf Efendi ihanetle suçlanmıştı." }
      - { kim: yusuf, metin: "Ben devletin hazinesini korudum! Asıl hırsız sensin, Bekir!", ifade: ofkeli, poz: isaret }
      - { kim: bekir, metin: "Mühür benim, hüküm benim. Senin sesin kimseye ulaşmaz.", poz: isaret }
      - { kim: yusuf, metin: "Emir… Zeynep… Sizi Allah'a emanet ediyorum.", poz: el_gogus }
      - { kim: bekir, metin: "Konağını yakın! Soyundan kimse sağ kalmasın!", ifade: ofkeli, poz: kol_kaldir }
  - mekan: halic_liman
    karakterler: [{ id: murad, x: 0.32 }, { id: hizir, x: 0.72 }]
    satirlar:
      - { kim: anlatici, metin: "On yıl sonra… Haliç'e bir gemi yanaştı." }
      - { kim: hizir, metin: "Bu şehre intikam için mi döndün evlat, ölmek için mi?" }
      - { kim: murad, metin: "Emir o gece yandı, Reis. Artık ben Tüccar Murad'ım.", ifade: ofkeli, poz: el_gogus }
      - { kim: hizir, metin: "Kara Bekir artık vezir. Dikkatli ol.", poz: isaret }
      - { kim: murad, metin: "Ondan her şeyini alacağım. Altınını, şanını… ve adını.", ifade: sinsi }
  - mekan: konak_salon
    karakterler: [{ id: bekir, x: 0.3 }, { id: saffet, x: 0.72 }]
    satirlar:
      - { kim: anlatici, metin: "Vezirin konağında…" }
      - { kim: saffet, metin: "Paşam, limana zengin bir tüccar inmiş. Gemisi altınla dolu.", poz: isaret }
      - { kim: bekir, metin: "O tüccarı yarın akşam soframa çağır.", ifade: sinsi }
      - { kim: saffet, metin: "Emredersiniz paşam.", ifade: sinsi, poz: el_gogus }
  - mekan: konak_salon
    gece: true
    karakterler: [{ id: murad, x: 0.3 }, { id: zeynep, x: 0.72 }]
    satirlar:
      - { kim: anlatici, metin: "Ertesi akşam…" }
      - { kim: zeynep, metin: "Hoş geldiniz efendim. Paşam sizi bekliyor, buyurun.", poz: el_gogus }
      - { kim: murad, metin: "Bu ses… Bu yüz… Olamaz.", ifade: saskin }
son: { kim: murad, metin: "Zeynep?.. Kardeşim… Sen yaşıyor musun?", ifade: saskin }
aciklama: |
  On yıl önce babası idam edildi, konağı yakıldı, kendisi öldü sanıldı… Şimdi "Tüccar Murad" adıyla İstanbul'a döndü. 🌷🩸
  Lale ile Kan — 1. Bölüm. Sizce Zeynep onu tanıyacak mı? Yorumlara yazın 👇
etiketler: ["#laleilekan", "#dizi", "#animasyon", "#intikam", "#osmanlı", "#laledevri", "#hikaye", "#reels", "#keşfet"]
