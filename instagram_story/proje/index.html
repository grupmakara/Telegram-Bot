<!doctype html>
<html
  lang="tr"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"series","type":"string","label":"Dizi adı","default":"BODRUM KATTAKİ ADAM"},
    {"id":"badge","type":"string","label":"Rozet","default":"YENİ DİZİ YAYINDA"},
    {"id":"cta","type":"string","label":"Çağrı","default":"Profilden hemen izle"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #17132e;
        --purple: #2b2370;
        --yellow: #f5c542;
        --red: #e03c3c;
        --ink: #ffffff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root { width: 100%; height: 100%; position: relative; }
      .full { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="19" data-width="1080" data-height="1920">
      <!-- Footage: the real episodes -->
      <video id="v-hook" class="clip full" src="assets/video/hook.mp4" data-start="0" data-duration="3.6" data-track-index="0" data-has-audio="true" data-volume="1" data-fade-out="0.2" playsinline></video>
      <video id="v-ep1" class="clip full" src="assets/video/ep1.mp4" data-start="3.6" data-duration="1.9" data-track-index="0" muted playsinline></video>
      <video id="v-ep2" class="clip full" src="assets/video/ep2.mp4" data-start="5.5" data-duration="1.9" data-track-index="0" muted playsinline></video>
      <video id="v-ep3" class="clip full" src="assets/video/ep3.mp4" data-start="7.4" data-duration="1.9" data-track-index="0" muted playsinline></video>
      <video id="v-ep4" class="clip full" src="assets/video/ep4.mp4" data-start="9.3" data-duration="1.9" data-track-index="0" muted playsinline></video>
      <video id="v-ep5" class="clip full" src="assets/video/ep5.mp4" data-start="11.2" data-duration="1.9" data-track-index="0" muted playsinline></video>
      <video id="v-ep6" class="clip full" src="assets/video/ep6.mp4" data-start="13.1" data-duration="1.9" data-track-index="0" muted playsinline></video>

      <!-- Overlay scenes -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="3.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="montage" data-composition-id="montage" data-composition-src="compositions/montage.html" data-start="3.6" data-duration="11.4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="15" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <!-- Sound -->
      <audio id="bed" class="clip" src="assets/audio/bed.wav" data-start="3.4" data-duration="11.8" data-track-index="2" data-volume="0.8"></audio>
      <audio id="sting" class="clip" src="assets/audio/sting.wav" data-start="15" data-duration="3.36" data-track-index="3" data-volume="1" data-fade-in="0.1"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
