<style>
/* Layout: tek sütunlu mobil uygulama; üstte başlık, altta sabit sekme çubuğu, ortada kartlar */
:root{

}

  --line:#2d3646; --accent:#ff8a3d; --accent-fg:#1a0d03; --accent-soft:#3a2414;

*{box-sizing:border-box}

body{font-family:var(--body);font-size:16px;line-height:1.55;margin:0;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px}
header.top .back{border:0;background:var(--surface2);color:var(--fg);width:38px;height:38px;border-radius:10px;font-size:20px;cursor:pointer;flex:none}
header.top h1{font-family:var(--display);font-size:1.2rem;margin:0;line-height:1.2;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:.75rem;font-weight:600;background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:99px;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;color:var(--muted);text-decoration:none;font-size:.72rem;font-weight:600}
nav.tabs a svg{width:23px;height:23px}
nav.tabs a.on{color:var(--accent)}
h2{font-family:var(--display);font-size:1.35rem;margin:6px 0 0;line-height:1.25;text-wrap:balance}
h3{font-family:var(--display);font-size:1.08rem;margin:0;line-height:1.3}
p{margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.hero{background:var(--blue);color:#fff;border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px}
:root[data-theme="dark"] .hero{color:#0d1626}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero{color:#0d1626}}
.hero h2{margin:0;font-size:1.5rem}
.bar{height:9px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:9px}
.bar.plain{background:var(--surface2)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:var(--fg);display:flex;flex-direction:column;gap:4px;min-height:96px}
.tile b{font-family:var(--display);font-size:1.05rem}
.tile span{font-size:.82rem;color:var(--muted);line-height:1.35}
.tile .ic{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-family:var(--display);font-size:.9rem}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--fg);cursor:pointer;text-align:left;font:inherit;width:100%}
.row .num{flex:none;width:34px;height:34px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.row.done .num{background:var(--ok-soft);color:var(--ok)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;line-height:1.3}
.row .t small{color:var(--muted);font-size:.8rem}
.row .chev{color:var(--muted);flex:none}
.ex{border-left:3px solid var(--blue);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:2px}
.ex .nl{font-weight:600}
.ex .tr{color:var(--muted)}
.ex .note{font-size:.82rem;color:var(--blue)}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.rules li::marker{color:var(--accent)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--surface2);font-weight:600;font-size:.8rem;letter-spacing:.02em}
tr:last-child td{border-bottom:0}
.btn{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-fg);text-decoration:none;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sec{background:var(--surface2);color:var(--fg)}
.btn.ghost{background:transparent;color:var(--blue);padding:8px 10px}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 auto}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.q{display:flex;flex-direction:column;gap:10px}
.q .qt{font-weight:600}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:11px 14px;font:inherit;cursor:pointer}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{font-size:.9rem;border-radius:10px;padding:9px 12px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface2);color:var(--fg);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
.built{min-height:48px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.built .chip{background:var(--blue-soft);border-color:transparent}
input[type=text],textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font:inherit;background:var(--surface);color:var(--fg)}
textarea{min-height:220px;resize:vertical}
.flash{min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;cursor:pointer;user-select:none}
.flash .w{font-family:var(--display);font-size:1.8rem;line-height:1.2}
.flash .m{font-size:1.15rem;color:var(--accent);font-weight:600}
.pill{align-self:flex-start;display:inline-block;font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.segs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.segs button{flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:7px 13px;font:inherit;font-size:.88rem;cursor:pointer}
.segs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.timer{font-family:var(--display);font-size:2.4rem;font-variant-numeric:tabular-nums;text-align:center}
.speak{border:0;background:var(--blue-soft);color:var(--blue);border-radius:10px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.tip{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:.92rem}
.tip b{color:var(--accent)}
details{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px}
details summary{cursor:pointer;padding:12px 0;font-weight:600}
details[open]{padding-bottom:12px}
.score{font-family:var(--display);font-size:3rem;text-align:center;line-height:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

  "<b>om … te</b> = '-mek için / amacıyla': <i>Ik leer Nederlands <b>om</b> werk <b>te</b> vinden.</i>",
  "Kalıplar: <i>Het is belangrijk/moeilijk/leuk <b>om</b> … <b>te</b> …</i>",
  "Modal fiillerden (kunnen, moeten, willen, mogen, zullen) ve gaan, laten, blijven, komen'den sonra <b>te yok</b>.",
  "Ayrılabilen fiilde te ortaya girer: <i>op te staan, mee te nemen.</i>"],
 ex:[["Ik probeer elke dag Nederlands te spreken.","Her gün Hollandaca konuşmaya çalışıyorum.","proberen + te"],
     ["Ik ben vergeten de deur dicht te doen.","Kapıyı kapatmayı unuttum.","vergeten + te"],
     ["Ik spaar geld om een auto te kopen.","Araba almak için para biriktiriyorum.","om … te = amacıyla"],
     ["Het is belangrijk om op tijd te komen.","Zamanında gelmek önemlidir.","Het is … om te"]],
 q:[["mc","Ik probeer Nederlands ____.",["leren","te leren","om leren"],1,"proberen + te + mastar."],
    ["mc","Ik ga naar de gemeente ____ een paspoort aan te vragen.",["om","te","voor"],0,"Amaç → om … te."],
    ["mc","Ik wil morgen ____.",["te werken","werken","om werken"],1,"Modal fiil willen → te yok."],
    ["order","het is|belangrijk|om|op tijd|te komen","Het is belangrijk om op tijd te komen."],
    ["mc","Hij is begonnen een cursus ____.",["volgen","te volgen","om volgen"],1,"beginnen + te."],
    ["fill","Ik heb besloten een nieuwe baan ____ zoeken.",["te"],"besluiten + te"]]},

{id:"perfectum", t:"Perfectum (konuşma geçmişi)", s:"heb gewerkt / ben gegaan",
 rules:[
  "Konuşmada geçmiş olaylar için en çok kullanılan zaman: <b>hebben/zijn + voltooid deelwoord</b> (ortaç sonda).",
  "Düzenli fiil: <b>ge + kök + t/d</b>. Kök 't kofschip harflerinden biriyle (t, k, f, s, ch, p) bitiyorsa <b>-t</b>, yoksa <b>-d</b>: werken → gewerkt, wonen → gewoond.",
  "Kök v/z ile biten mastar kökte f/s olur ama kural mastardaki harfe bakar: reizen → gereisd, leven → geleefd.",
  "<b>be-, ge-, her-, ont-, ver-, er-</b> ile başlayan fiiller ge- almaz: betalen → betaald, vertellen → verteld.",
  "<b>zijn</b> ile kurulanlar: yer/durum değişimi bildiren fiiller: gaan, komen, vertrekken, aankomen, opstaan, worden, blijven, zijn, beginnen, vallen, verhuizen.",
  "Ayrılabilen fiilde ge- ortaya girer: opbellen → opgebeld, opstaan → opgestaan."],
 ex:[["Ik heb gisteren gewerkt.","Dün çalıştım.","heb + gewerkt"],
     ["Ik ben om zes uur naar huis gegaan.","Saat altıda eve gittim.","Hareket → zijn"],
     ["Wij hebben de rekening betaald.","Faturayı ödedik.","be- → ge- yok"],
     ["Hij is vroeg opgestaan.","Erken kalktı.","op-ge-staan"]],
 q:[["order","ik|heb|gisteren|gewerkt","Ik heb gisteren gewerkt."],
    ["order","wij|zijn|naar huis|gegaan","Wij zijn naar huis gegaan."],
    ["mc","Ik ____ vorig jaar naar Almere verhuisd.",["heb","ben","was"],1,"verhuizen yer değişimi → zijn."],
    ["mc","Zij ____ een brief geschreven.",["heeft","is","hebben"],0,"schrijven → hebben."],
    ["fill","maken → ik heb ____",["gemaakt"],"maak + t ('t kofschip: k)"],
    ["fill","wonen → ik heb in Turkije ____",["gewoond"],"woon + d"],
    ["fill","betalen → ik heb ____",["betaald"],"be- ile başlayan fiil ge- almaz"],
    ["fill","opbellen → ik heb hem ____",["opgebeld"],"op + ge + beld"]]},

{id:"imperfectum", t:"Imperfectum (hikâye/alışkanlık geçmişi)", s:"werkte, woonde, ging",
 rules:[
  "Geçmişteki <b>durum, alışkanlık</b> ve <b>hikâye anlatımı</b> için kullanılır: <i>Vroeger werkte ik in de bouw.</i>",
  "Düzenli fiil: kök + <b>te/ten</b> ('t kofschip) veya <b>de/den</b>: werken → werkte/werkten, wonen → woonde/woonden.",
  "Düzensiz fiilleri ezberle: zijn → was/waren, hebben → had/hadden, gaan → ging, komen → kwam, doen → deed, zien → zag, krijgen → kreeg (Fiil Bankası bölümüne bak).",
  "İpucu kelimeler: <i>vroeger</i> (eskiden), <i>toen</i> (o zaman), <i>elke dag</i>, <i>altijd</i>."],
 ex:[["Vroeger werkte ik in een fabriek.","Eskiden fabrikada çalışıyordum.","Alışkanlık"],
     ["Toen ik klein was, woonde ik in Ankara.","Küçükken Ankara'da yaşıyordum.","Durum"],
     ["Gisteren ging ik naar de markt en kocht ik groente.","Dün pazara gidip sebze aldım.","Hikâye"]],
 q:[["mc","Vroeger ____ ik elke dag met de bus.",["ga","ging","gegaan"],1,"gaan → ging"],
    ["fill","wonen → vroeger ____ ik in Turkije.",["woonde"],"woon + de"],
    ["fill","werken → wij ____ in de bouw.",["werkten"],"çoğul: werk + ten"],
    ["mc","Toen ik jong ____, sportte ik veel.",["ben","was","had"],1,"zijn → was"],
    ["order","vroeger|werkte|ik|in een fabriek","Vroeger werkte ik in een fabriek."],
    ["mc","Hij ____ gisteren een nieuwe telefoon.",["kocht","koopte","kopte"],0,"kopen düzensiz → kocht"]]},

{id:"plusq", t:"Plusquamperfectum", s:"had gewerkt / was vertrokken",
 rules:[
  "Geçmişteki bir olaydan <b>daha önce</b> olmuş şeyi anlatır: 'yapmıştım / gitmişti'.",
  "Yapı: <b>had/hadden</b> veya <b>was/waren</b> + ortaç.",

    ["mc","Toen ik thuiskwam, ____ mijn vrouw al weggegaan.",["had","was","is"],1,"weggaan → zijn → was"],
    ["order","nadat|ik|had gegeten,|ging|ik|werken","Nadat ik had gegeten, ging ik werken."]]},

{id:"nietgeen", t:"niet ve geen", s:"olumsuzluk",
 rules:[
  "<b>geen</b>: belirsiz isimden (een + isim veya artikelsiz isim) önce: <i>Ik heb geen auto. Ik drink geen koffie.</i>",
  "<b>niet</b>: fiil, sıfat, zarf, belirli isim (de/het/mijn…) ve isimleri olumsuzlar.",
  "niet'nin yeri: genelde <b>cümle sonunda</b>; ama sıfattan, edatlı öbekten ve sonraki fiil/ortaçtan <b>önce</b>: <i>Ik ga niet naar huis. Ik heb het niet gedaan.</i>",
  "<b>nog niet</b> = henüz değil, <b>geen … meer</b> = artık yok, <b>niet meer</b> = artık değil."],
 ex:[["Ik heb geen tijd.","Vaktim yok.","Belirsiz isim → geen"],
     ["Ik werk vandaag niet.","Bugün çalışmıyorum.","Fiil → niet sonda"],
     ["Dat is niet moeilijk.","Bu zor değil.","Sıfat → niet önce"],
     ["Ik heb geen auto meer.","Artık arabam yok.","geen … meer"]],
 q:[["mc","Ik heb ____ tijd.",["niet","geen"],1,"tijd belirsiz isim → geen"],
    ["mc","Ik werk vandaag ____.",["niet","geen"],0,"Fiili olumsuzlama → niet"],
    ["mc","Dat is ____ probleem.",["niet","geen"],1,"een probleem → geen probleem"],
    ["mc","Ik begrijp het ____.",["niet","geen"],0,"het belirli → niet"],
    ["mc","Ik ken die man ____.",["niet","geen"],0,"die man belirli → niet"],
    ["mc","Hij heeft ____ kinderen.",["niet","geen"],1,"Artikelsiz çoğul → geen"],
    ["order","ik|ga|vandaag|niet|naar mijn werk","Ik ga vandaag niet naar mijn werk."]]},

{id:"die", t:"die / dat / waar / wie", s:"ilgi cümleleri",
 rules:[
  "<b>de</b>-kelimeleri ve tüm çoğullar → <b>die</b>: <i>de man die…, de mensen die…</i>",
  "<b>het</b>-kelimeleri (tekil) → <b>dat</b>: <i>het huis dat…</i>",
  "Edatla birlikte: <b>insan</b> → edat + <b>wie</b> (<i>met wie</i>), <b>şey</b> → <b>waar</b> + edat (<i>waarmee, waarover, waar … naar</i>).",
  "İlgi cümlesinde de fiil <b>sona</b> gider."],
 ex:[["De man die daar werkt, is mijn collega.","Orada çalışan adam iş arkadaşım.","de man → die"],
     ["Het huis dat we huren, is groot.","Kiraladığımız ev büyük.","het huis → dat"],
     ["De collega met wie ik werk, is aardig.","Birlikte çalıştığım meslektaş kibar.","insan → met wie"],
     ["De pen waarmee ik schrijf, is van mij.","Yazdığım kalem benim.","şey → waarmee"]],
 q:[["mc","De vrouw ____ daar werkt, is mijn buurvrouw.",["die","dat","wie"],0,"de vrouw → die"],
    ["mc","Het bedrijf ____ ik ken, is groot.",["die","dat","waar"],1,"het bedrijf → dat"],
    ["mc","De baan ____ ik naar zoek, is interessant.",["die","dat","waar"],2,"zoeken naar + şey → waar … naar"],
    ["mc","De collega met ____ ik werk, is aardig.",["die","wie","waar"],1,"Edat + insan → wie"],
    ["mc","De kinderen ____ buiten spelen, zijn van de buren.",["die","dat"],0,"Çoğul → die"],
    ["mc","Het formulier ____ ik heb ingevuld, ligt op tafel.",["die","dat"],1,"het formulier → dat"]]},

{id:"scheid", t:"Ayrılabilen fiiller", s:"opstaan → ik sta op",
 rules:[
  "opstaan, aankomen, meenemen, terugkomen, opbellen, invullen, afspreken, uitleggen gibi fiillerin ön eki vardır.",

{id:"vergelijk", t:"Karşılaştırma ve sıfatlar", s:"groter dan, het grootst, een groot huis",
 rules:[
  "Karşılaştırma: sıfat + <b>-er</b> + <b>dan</b>: <i>groot → groter dan</i>. -r ile bitenler <b>-der</b>: duur → duurder, ver → verder.",
  "En üstün: <b>het</b> + sıfat + <b>-st</b>: <i>het grootst / de grootste</i>.",
  "Düzensiz: goed – beter – best, veel – meer – meest, weinig – minder – minst, graag – liever – liefst.",
  "Eşitlik: <b>even … als / net zo … als</b>: <i>Hij is even oud als ik.</i>",
  "<b>Sıfat çekimi</b>: İsmin önünde sıfat genelde <b>-e</b> alır (<i>de grote stad, het grote huis, mooie huizen</i>). <b>İstisna</b>: het-kelimesi tekil + een/geen/artikelsiz → -e yok: <i>een groot huis</i>."],
 ex:[["Deze baan is beter betaald dan mijn vorige baan.","Bu iş önceki işimden daha iyi ücretli.","beter dan"],
     ["Ik heb minder tijd dan vroeger.","Eskisinden daha az vaktim var.","minder dan"],
     ["Amsterdam is de grootste stad van Nederland.","Amsterdam Hollanda'nın en büyük şehridir.","de grootste"],
     ["We hebben een klein huis met een mooie tuin.","Güzel bahçeli küçük bir evimiz var.","een klein huis (het) / een mooie tuin (de)"]],
 q:[["mc","Mijn Nederlands is ____ dan vorig jaar.",["goeder","beter","best"],1,"goed → beter"],
    ["mc","Een appartement in Amsterdam is ____ dan in Almere.",["duurer","duurder","meer duur"],1,"-r ile bitiyor → duurder"],
    ["mc","Ik drink ____ thee dan koffie.",["liever","graager","meer graag"],0,"graag → liever"],
    ["mc","Wij wonen in een ____ huis.",["groot","grote"],0,"het huis + een → -e yok"],
    ["mc","Het ____ huis staat op de hoek.",["groot","grote"],1,"het + sıfat → -e"],
    ["mc","Hij is even oud ____ zijn vrouw.",["dan","als","zo"],1,"even … als"],
    ["fill","Dit is het ____ resultaat. (goed, en iyi)",["beste"],"goed – beter – best → het beste resultaat"]]},

{id:"zich", t:"Dönüşlü fiiller (zich)", s:"ik voel me, hij meldt zich ziek",

  "Zamir fiilden hemen sonra gelir; inversiede öznenin arkasına: <i>Morgen meld ik <b>me</b> aan.</i>"],

    ["mc","Zij herinnert ____ de naam niet.",["haar","zich","me"],1,"zij (o) → zich"],
    ["mc","Jullie moeten ____ haasten.",["zich","je","ons"],1,"jullie → je"],
    ["order","ik|moet|me|ziek|melden","Ik moet me ziek melden."]]},

{id:"zou", t:"zou / zouden", s:"kibar rica, tavsiye, hayal",

{id:"er", t:"'er' kelimesi", s:"Er is een storing. Ik heb er twee.",

  "<b>5. Edilgen</b>: <i><b>Er</b> wordt hier veel gewerkt.</i>"],

     ["Hoeveel broers heb je? Ik heb er drie.","Kaç erkek kardeşin var? Üç.","Miktar"],
     ["Heb je aan de afspraak gedacht? Ja, ik heb eraan gedacht.","Randevuyu hatırladın mı? Evet.","er + aan"]],

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function norm(s){return String(s).toLowerCase().replace(/[.,!?¿:;'"’]/g,"").replace(/\s+/g," ").trim();}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function el(html){const d=document.createElement("div");d.innerHTML=html.trim();return d.firstElementChild;}
let nlVoice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();nlVoice=vs.find(v=>/^nl(-|_)NL/i.test(v.lang))||vs.find(v=>/^nl/i.test(v.lang))||null;}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
function speak(text,rate){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="nl-NL";if(nlVoice)u.voice=nlVoice;u.rate=rate||0.9;speechSynthesis.speak(u);return true;}catch(e){return false;}}
const hasTTS = typeof window.speechSynthesis!=="undefined";
const speakBtn=(text,label)=>hasTTS?`<button class="speak" data-say="${esc(text)}">🔊 ${label||"Dinle"}</button>`:"";
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]");if(b){speak(b.dataset.say,Number(b.dataset.rate)||0.9);}});

/* Alıştırma bileşeni: her soru kendi geri bildirimini verir; onAnswer(doğruMu) çağrılır */
function renderQuestion(q,onAnswer){
  const box=el(`<div class="q"></div>`);
  const fb=()=>box.querySelector(".fb");
  const show=(ok,msg)=>{let f=fb();if(!f){f=el(`<div class="fb"></div>`);box.appendChild(f);}f.className="fb "+(ok?"ok":"no");f.innerHTML=msg;};
  let answered=false;
  if(q[0]==="mc"){
    const [,qt,opts,ai,expl]=q;
    box.appendChild(el(`<div class="qt">${esc(qt)}</div>`));
    const order=shuffle(opts.map((o,i)=>i));
    order.forEach(i=>{const b=el(`<button class="opt">${esc(opts[i])}</button>`);b.onclick=()=>{
      if(answered)return;answered=true;
      box.querySelectorAll(".opt").forEach(x=>x.disabled=true);
      const ok=i===ai;b.classList.add(ok?"right":"wrong");
      if(!ok)[...box.querySelectorAll(".opt")].find(x=>x.textContent===opts[ai]).classList.add("right");
      show(ok,(ok?"✓ Doğru! ":"✗ Doğru cevap: <b>"+esc(opts[ai])+"</b>. ")+(expl?esc(expl):""));onAnswer&&onAnswer(ok);
    };box.appendChild(b);});
  } else if(q[0]==="order"){
    const parts=q[1].split("|");const target=q[2];
    box.appendChild(el(`<div class="qt">Cümleyi doğru sıraya koy:</div>`));
    const built=el(`<div class="built" aria-label="Kurduğun cümle"></div>`);
    const pool=el(`<div class="chips"></div>`);
    let picked=[];
    const redraw=()=>{built.innerHTML="";picked.forEach((p,k)=>{const c=el(`<button class="chip">${esc(p.t)}</button>`);c.onclick=()=>{if(answered)return;picked.splice(k,1);pool.querySelector(`[data-i="${p.i}"]`).hidden=false;redraw();};built.appendChild(c);});
      if(!picked.length)built.appendChild(el(`<span class="muted small">Aşağıdaki parçalara sırayla dokun</span>`));};
    let sh=shuffle(parts.map((t,i)=>({t,i})));
    if(sh.map(x=>x.i).join()===parts.map((t,i)=>i).join()&&parts.length>1)sh.push(sh.shift());
    sh.forEach(p=>{const c=el(`<button class="chip" data-i="${p.i}">${esc(p.t)}</button>`);c.onclick=()=>{if(answered)return;picked.push(p);c.hidden=true;redraw();};pool.appendChild(c);});
    redraw();box.appendChild(built);box.appendChild(pool);
    const chk=el(`<div class="btns"><button class="btn sec">Temizle</button><button class="btn">Kontrol et</button></div>`);
    chk.children[0].onclick=()=>{if(answered)return;picked=[];pool.querySelectorAll(".chip").forEach(c=>c.hidden=false);redraw();};
    chk.children[1].onclick=()=>{if(answered||picked.length<parts.length)return;answered=true;const ok=norm(picked.map(p=>p.t).join(" "))===norm(target);
      show(ok,(ok?"✓ Doğru! ":"✗ Doğrusu: ")+"<b>"+esc(target)+"</b>");chk.remove();onAnswer&&onAnswer(ok);};
    box.appendChild(chk);
  } else if(q[0]==="fill"){
    const [,qt,acc,hint]=q;
    box.appendChild(el(`<div class="qt">${esc(qt)}</div>`));
    const id="f"+Math.random().toString(36).slice(2,8);
    const inp=el(`<input type="text" id="${id}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Cevabını yaz">`);
    box.appendChild(inp);
    const b=el(`<button class="btn">Kontrol et</button>`);
    const go=()=>{if(answered||!inp.value.trim())return;answered=true;const ok=acc.some(a=>norm(a)===norm(inp.value));inp.disabled=true;b.remove();
      show(ok,(ok?"✓ Doğru! ":"✗ Doğru cevap: <b>"+esc(acc[0])+"</b>. ")+(hint?esc(hint):""));onAnswer&&onAnswer(ok);};
    b.onclick=go;inp.addEventListener("keydown",e=>{if(e.key==="Enter")go();});
    box.appendChild(b);
  }
  return box;
}

function bindKelime(){
  document.querySelectorAll("#vcats button").forEach(b=>b.onclick=()=>{vCat=b.dataset.c;vDeck=null;vIdx=0;vFlip=false;render();});

  const f=$("#flash"); if(f){const flip=()=>{vFlip=!vFlip;render();};f.onclick=flip;f.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip();}};}
  const k=$("#vKnow"); if(k)k.onclick=()=>{const w=vDeck[vIdx%vDeck.length];S.known[w[0]]=1;save();vIdx++;vFlip=false;render();};
  const a=$("#vAgain"); if(a)a.onclick=()=>{const w=vDeck[vIdx%vDeck.length];delete S.known[w[0]];save();vDeck.push(w);vIdx++;vFlip=false;render();};
}

function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function bindSpreken(){
  document.querySelectorAll("#spcats button").forEach(b=>b.onclick=()=>{spCat=b.dataset.c;spQ=null;stopT();render();});
  $("#spNext").onclick=()=>{spQ=null;stopT();render();};
  $("#spStart").onclick=()=>{if(spT){stopT();render();return;}spLeft=120;spT=setInterval(()=>{spLeft--;const t=$("#sptimer");if(t)t.textContent=fmt(spLeft);if(spLeft<=0){stopT();const t2=$("#sptimer");if(t2)t2.textContent="Süre bitti ✓";const b=$("#spStart");if(b)b.textContent="2 dk başlat";}},1000);$("#spStart").textContent="Durdur";};
}
function stopT(){if(spT){clearInterval(spT);spT=null;}spLeft=120;}

let swIdx=0;
const CONNECTORS=["omdat","want","daarom","maar","toch","als","hoewel","terwijl","dus","bovendien","daarna","eerst","daardoor","zodat","nadat","voordat","zodra","ook","verder","daarnaast"];
views.schrijven=()=>{
  const draft=S.drafts[swIdx]||"";
  return `<h2>Schrijven · Yazma</h2>
  <div class="tip"><b>Düzen:</b> Giriş → açıklama/neden → istek/çözüm → kapanış. Görevdeki <b>tüm maddeleri</b> cevapla. 80–120 kelime, en az 2 bağlaç.</div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="pill">Görev ${swIdx+1} / ${SCHRIJVEN.length}</span>
      <div class="btns" style="flex:none"><button class="btn sec" id="swPrev" aria-label="Önceki görev">‹</button><button class="btn sec" id="swNext" aria-label="Sonraki görev">›</button></div></div>
    <h3>${esc(SCHRIJVEN[swIdx])}</h3>
    <label for="swText" class="small muted">E-postanı Hollandaca yaz (taslak bu telefonda saklanır):</label>
    <textarea id="swText" placeholder="Beste … / Geachte heer/mevrouw,">${esc(draft)}</textarea>
    <div id="swStats" class="small"></div>
    <div class="btns"><button class="btn sec" id="swTpl">Şablonu ekle</button></div>
  </div>
  <details><summary>Hazır e-posta şablonu</summary><p style="white-space:pre-line">Onderwerp: Vraag over …

Geachte heer/mevrouw, (resmi) / Beste [naam], (tanıdık)

Ik schrijf u omdat …
Ik wil graag weten of …
Daarnaast heb ik een vraag over …
Kunt u mij laten weten wat mogelijk is?

Alvast bedankt voor uw hulp.

Met vriendelijke groet,
[Naam]</p></details>
  ${SCHRIJF_MODELS.map(m=>`<details><summary>Örnek: ${esc(m[0])}</summary><p style="white-space:pre-line">${esc(m[1])}</p></details>`).join("")}
  <details><summary>Kontrol listesi</summary><ul class="rules small"><li>Hitap ve kapanış doğru mu? (resmi: <i>Geachte … / Met vriendelijke groet</i>)</li><li>Görevdeki her maddeyi yazdın mı?</li><li>Fiil 2. sırada mı, yan cümlede sonda mı?</li><li>Büyük harf, nokta ve virgül doğru mu?</li><li>En az 2 bağlaç: omdat, daarom, maar, als, bovendien…</li></ul></details>`;
};
function bindSchrijven(){
  const ta=$("#swText"), st=$("#swStats");
  const upd=()=>{const words=ta.value.trim()?ta.value.trim().split(/\s+/).length:0;const low=" "+ta.value.toLowerCase().replace(/[.,!?;:]/g," ")+" ";
    const used=CONNECTORS.filter(c=>low.includes(" "+c+" "));
    const wc=words<80?`<span style="color:var(--bad)">${words} kelime (hedef 80–120)</span>`:words>150?`<span style="color:var(--accent)">${words} kelime (biraz uzun)</span>`:`<span style="color:var(--ok)">${words} kelime ✓</span>`;
    st.innerHTML=`${wc} · Bağlaçlar: ${used.length?used.map(u=>`<span class="pill ok">${u}</span>`).join(" "):'<span style="color:var(--bad)">henüz yok</span>'}`;
    S.drafts[swIdx]=ta.value;save();};
  ta.addEventListener("input",upd);upd();
  $("#swPrev").onclick=()=>{swIdx=(swIdx-1+SCHRIJVEN.length)%SCHRIJVEN.length;render();};
  $("#swNext").onclick=()=>{swIdx=(swIdx+1)%SCHRIJVEN.length;render();};
  $("#swTpl").onclick=()=>{if(!ta.value.trim()){ta.value="Geachte heer/mevrouw,\n\nIk schrijf u omdat \n\nIk wil graag weten of \n\nKunt u mij laten weten wat mogelijk is?\n\nAlvast bedankt voor uw hulp.\n\nMet vriendelijke groet,\n";upd();}ta.focus();};
}

views.knm=()=>{
  setTimeout(()=>{const w=$("#knmq");let n=0,c=0;KNM_Q.forEach((q,i)=>{const card=el(`<div class="card"><span class="pill">Soru ${i+1}</span></div>`);
    card.appendChild(renderQuestion(["mc",q[0],q[1],q[2]],ok=>{n++;if(ok)c++;if(n===KNM_Q.length)$("#knmres").innerHTML=`<div class="tip"><b>Sonuç:</b> ${c}/${KNM_Q.length} doğru.</div>`;}));w.appendChild(card);});});
  return `<h2>KNM · Hollanda toplumu bilgisi</h2>
  <p class="muted small">Kennis van de Nederlandse Maatschappij. Konuları Türkçe özetledik; sınav Hollandaca olduğu için anahtar kelimeleri Hollandaca öğren.</p>
  ${KNM.map(k=>`<details><summary>${esc(k.t)}</summary><ul class="rules small">${k.p.map(p=>`<li>${p}</li>`).join("")}</ul></details>`).join("")}
  <h2>KNM testi</h2><div id="knmq" class="list"></div><div id="knmres"></div>
  <p class="small muted">Rakamlar ve kurallar değişebilir; güncel bilgiyi resmi kaynaklardan (DUO, Rijksoverheid, gemeente) kontrol et.</p>`;
};

let fvMode="tablo";
views.fiiller=()=>{
  let body;
  if(fvMode==="tablo"){
    body=`<div class="tbl"><table><tr><th>Mastar</th><th>Imperfectum</th><th>Perfectum</th><th>Türkçe</th></tr>${VERBS.map(v=>`<tr><td><b>${esc(v[0])}</b></td><td>${esc(v[1])}</td><td>${esc(v[2])}</td><td>${esc(v[3])}</td></tr>`).join("")}</table></div>`;
  } else {
    body=`<div id="fvq" class="list"></div><div class="btns"><button class="btn" id="fvNew">Yeni 10 soru</button></div>`;
    setTimeout(()=>{const w=$("#fvq");if(!w)return;const pick=shuffle(VERBS).slice(0,10);
      pick.forEach((v,i)=>{const kind=Math.random()<.5?1:2;const correct=v[kind];
        const pool=shuffle(VERBS.filter(x=>x!==v)).slice(0,6).map(x=>x[kind]);
        let fake=kind===1?v[0].replace(/en$/,"")+"de":(kind===2?"heeft ge"+v[0].replace(/en$/,"")+"d":"");
        const opts=[correct];[fake,...pool].forEach(o=>{if(opts.length<3&&!opts.includes(o))opts.push(o);});
        const card=el(`<div class="card"><span class="pill">${i+1} / 10</span></div>`);
        card.appendChild(renderQuestion(["mc",`${v[0]} (${v[3]}) → ${kind===1?"imperfectum (ik/hij)":"perfectum (hij)"}?`,opts,0,`${v[0]} – ${v[1]} – ${v[2]}`]));w.appendChild(card);});
      const nb=$("#fvNew");if(nb)nb.onclick=()=>render();});
  }
  return `<h2>Fiil bankası</h2>
  <div class="tip"><b>Nasıl okunur:</b> Mastar (werken) · Imperfectum = geçmiş şekil (werkte = çalıştı/çalışıyordu) · Perfectum (heeft gewerkt = çalıştı). <b>is</b> ile olanlar hareket/değişim fiilleridir.</div>
  <div class="segs"><button class="${fvMode==="tablo"?"on":""}" data-fv="tablo">Tablo</button><button class="${fvMode==="test"?"on":""}" data-fv="test">Hızlı test</button></div>
  ${body}`;
};

views.plan=()=>`<h2>12 haftalık B1 planı</h2><p class="muted small">Tamamladığın haftayı işaretle.</p>
  <div class="list">${PLAN.map((p,i)=>`<label class="row check"><input type="checkbox" id="pl${i}" data-pl="${i}" ${S.plan[i]?"checked":""}><span class="t"><b>Hafta ${i+1}: ${esc(p[0])}</b><small>Günlük görev: ${esc(p[1])}</small></span><a class="btn ghost" href="#${LESSONS.some(l=>l.id===p[2])?"ders-"+p[2]:p[2]}">Aç</a></label>`).join("")}</div>
  <h2>Sınav öncesi son kontrol</h2>
  <div class="card">${FINAL_CHECK.map((c,i)=>`<label class="check"><input type="checkbox" id="fc${i}" data-fc="${i}" ${S.check[i]?"checked":""}><span>${esc(c)}</span></label>`).join("")}</div>`;

/* Deneme sınavı: tüm havuzdan karışık 20 soru */
let exam=null;
function buildExam(){
  const pool=[];
  LESSONS.forEach(l=>l.q.forEach(q=>pool.push({sec:"Gramer",q})));
  LEZEN.forEach(t=>t.q.forEach(q=>pool.push({sec:"Lezen",ctx:t.x,q:["mc",q[0],q[1],q[2],q[3]]})));
  LUISTER.forEach(it=>pool.push({sec:"Luisteren",audio:it[0],q:["mc",it[1],it[2],it[3],it[4]]}));
  KNM_Q.forEach(q=>pool.push({sec:"KNM",q:["mc",q[0],q[1],q[2]]}));
  const by=s=>shuffle(pool.filter(p=>p.sec===s));
  return shuffle([...by("Gramer").slice(0,10),...by("Lezen").slice(0,4),...by("Luisteren").slice(0,3),...by("KNM").slice(0,3)]);
}
views.deneme=()=>{
  if(!exam) return `<h2>Deneme sınavı</h2>
    <div class="card"><p>Karışık <b>20 soru</b>: 10 gramer, 4 okuma, 3 dinleme, 3 KNM. Her seferinde farklı sorular gelir.</p>
    <p class="small muted">En iyi sonucun: <b>${S.best||0}/20</b></p>
    <button class="btn" id="exStart">Sınavı başlat</button></div>
    <div class="tip"><b>Hatırlatma:</b> Gerçek sınava benzer pratik için DUO'nun resmi oefenexamens'ini de çöz. Konuşma ve yazma için Beceriler bölümündeki görevleri kullan.</div>`;
  setTimeout(()=>{
    const w=$("#exwrap");let n=0,c=0;const secs={};
    exam.forEach((it,i)=>{const card=el(`<div class="card"><span class="pill">${i+1} / ${exam.length} · ${it.sec}</span></div>`);
      if(it.ctx)card.appendChild(el(`<div class="ex" style="white-space:pre-line"><span>${esc(it.ctx)}</span></div>`));
      if(it.audio){card.appendChild(el(`<div class="btns">${hasTTS?`<button class="speak" data-say="${esc(it.audio)}">🔊 Dinle</button>`:`<div class="ex"><span>${esc(it.audio)}</span></div>`}</div>`));}
      card.appendChild(renderQuestion(it.q,ok=>{n++;if(ok)c++;secs[it.sec]=secs[it.sec]||[0,0];secs[it.sec][1]++;if(ok)secs[it.sec][0]++;
        if(n===exam.length){if(c>(S.best||0)){S.best=c;save();}
          $("#exres").innerHTML=`<div class="card" style="text-align:center"><div class="score">${c}/${exam.length}</div><p>${c>=16?"Çok iyi! Sınava hazırlığın güçlü.":c>=12?"İyi gidiyorsun. Yanlış bölümleri tekrar et.":"Gramer derslerini tekrar edip yeniden dene."}</p>
          <div class="tbl"><table><tr><th>Bölüm</th><th>Doğru</th></tr>${Object.entries(secs).map(([k,v])=>`<tr><td>${k}</td><td>${v[0]} / ${v[1]}</td></tr>`).join("")}</table></div>
          <button class="btn" id="exAgain">Yeni deneme</button></div>`;
          $("#exAgain").onclick=()=>{exam=buildExam();render();scrollTo(0,0);};
          $("#exres").scrollIntoView({behavior:"smooth"});}}));
      w.appendChild(card);});
  });
  return `<h2>Deneme sınavı</h2><div id="exwrap" class="list"></div><div id="exres"></div><button class="btn sec" id="exQuit">Sınavı bitir</button>`;
};

/* ============================ YÖNLENDİRME ============================ */
const TITLES={home:"B1 Hollandaca",dersler:"Gramer",kelime:"Kelimeler",beceri:"Beceriler",lezen:"Lezen",luisteren:"Luisteren",spreken:"Spreken",schrijven:"Schrijven",knm:"KNM",fiiller:"Fiil bankası",plan:"12 haftalık plan",deneme:"Deneme sınavı"};
const TAB_OF={home:"home",dersler:"dersler",kelime:"kelime",beceri:"beceri",lezen:"beceri",luisteren:"beceri",spreken:"beceri",schrijven:"beceri",knm:"beceri",fiiller:"beceri",plan:"beceri",deneme:"deneme"};
const PARENT={lezen:"beceri",luisteren:"beceri",spreken:"beceri",schrijven:"beceri",knm:"beceri",fiiller:"beceri",plan:"beceri"};
let lastRoute=null;
function route(){const h=(location.hash||"#home").slice(1);return h||"home";}
function render(){
  const r=route();
  if(r!=="spreken"&&spT)stopT();
  try{if(hasTTS)speechSynthesis.cancel();}catch(e){}
  let html, tab, title, parent=null;
  if(r.startsWith("ders-")){const id=r.slice(5);html=lessonView(id);tab="dersler";const l=LESSONS.find(x=>x.id===id);title=l?l.t:"Ders";parent="dersler";}
  else if(views[r]){html=views[r]();tab=TAB_OF[r];title=TITLES[r];parent=PARENT[r]||null;}
  else{html=views.home();tab="home";title=TITLES.home;}
  app.innerHTML=html;
  $("#title").textContent=title;
  const bb=$("#backBtn");bb.hidden=!parent;bb.onclick=()=>{location.hash=parent;};
  document.querySelectorAll("nav.tabs a").forEach(a=>a.classList.toggle("on",a.dataset.tab===tab));
  if(r!==lastRoute){window.scrollTo(0,0);lastRoute=r;}
  // bağlamalar
  if(r==="kelime")bindKelime();
  if(r==="spreken")bindSpreken();
  if(r==="schrijven")bindSchrijven();
  if(r==="home"){const tb=$("#themeBtn");if(tb)tb.onclick=()=>{S.theme=S.theme==null?"light":S.theme==="light"?"dark":null;save();applyTheme();render();};}
  if(r==="fiiller")document.querySelectorAll("[data-fv]").forEach(b=>b.onclick=()=>{fvMode=b.dataset.fv;render();});
  if(r==="plan"){document.querySelectorAll("[data-pl]").forEach(c=>c.onchange=()=>{S.plan[c.dataset.pl]=c.checked;save();});
    document.querySelectorAll("[data-fc]").forEach(c=>c.onchange=()=>{S.check[c.dataset.fc]=c.checked;save();});}
  if(r==="deneme"){const s=$("#exStart");if(s)s.onclick=()=>{exam=buildExam();render();};const q=$("#exQuit");if(q)q.onclick=()=>{exam=null;render();};}
}
function applyTheme(){if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);else document.documentElement.removeAttribute("data-theme");}
applyTheme();
window.addEventListener("hashchange",render);
render();
</script>
